services:
  - type: web
    name: teamflow-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: NODE_VERSION
        value: 20.19.6
      - key: DATABASE_URL
        value: "sqlite:///./teamflow.db"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct"
      - key: SECRET_KEY
        value: "teamflow-ai-super-secret-jwt-key-2026-production"
